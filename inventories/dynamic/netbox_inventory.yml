---
plugin: netbox.netbox.nb_inventory

# Configuration is safe in Git. Replace with your actual lab URL.
api_endpoint: "http://netbox.mylab.local:8000"

# The 'token' is a secret and is securely omitted. 
# It will be injected by the AAP Credential (NETBOX_TOKEN).

validate_certs: false
fetch_all: false
virtual_machines: true
devices: true

query_filters:
  - tag: aap_managed

compose:
  ansible_host: primary_ip4.address | default(primary_ip.address) | default(name) | regex_replace('/.*$', '')
